<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>新規登録</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background-color: #f5f6f8;
			min-height: 100vh;
			display: flex;
			align-items: center;
		}

		.auth-card {
			max-width: 400px;
			width: 100%;
			margin: 0 auto;
			border: none;
			border-radius: 12px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
		}

		.auth-card .card-body {
			padding: 2.5rem;
		}

		.btn-primary {
			background-color: #2b6cb0;
			border-color: #2b6cb0;
		}

		.btn-primary:hover {
			background-color: #245a93;
			border-color: #245a93;
		}

		.form-label {
			font-weight: 500;
			font-size: 0.9rem;
		}

		.form-text {
			font-size: 0.8rem;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="auth-card card">
			<div class="card-body">
				<h1 class="h4 fw-bold text-center mb-1">新規登録</h1>
				<p class="text-muted text-center small mb-4">必要な情報を入力してアカウントを作成します</p>

				<!-- エラーメッセージ(例: ユーザー名重複など) -->
				<div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert"
					th:text="${errorMessage}">
				</div>

				<!-- th:object でフォームとDTO(RegisterForm等)をバインドする想定 -->
				<form th:action="@{/user/register}" th:object="${userRegisterForm}" method="post">

					<div class="mb-3">
						<label for="username" class="form-label">ユーザー名</label>
						<input type="text" class="form-control" id="username" th:field="*{username}"
							placeholder="半角英数字で入力" required>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}"
							th:errors="*{username}"></div>
					</div>

					<div class="mb-3">
						<label for="password" class="form-label">パスワード</label>
						<input type="password" class="form-control" id="password" th:field="*{password}"
							placeholder="8文字以上で入力" required>
						<div class="form-text text-muted">英数字を含む8文字以上を推奨します</div>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
							th:errors="*{password}"></div>
					</div>

					<div class="mb-3">
						<label for="confirmPassword" class="form-label">パスワード(確認)</label>
						<input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
							th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordMatching')} ? 'is-invalid'"
							placeholder="もう一度入力してください" required>
						<div class="text-danger small mt-1" th:if="${#fields.hasErrors('passwordMatching')}"
							th:errors="*{passwordMatching}"></div>
					</div>

					<button type="submit" class="btn btn-primary w-100 mt-2">登録する</button>
				</form>

				<p class="text-center text-muted small mt-4 mb-0">
					すでにアカウントをお持ちの方は
					<a th:href="@{/login}" class="text-decoration-none">ログイン</a>
				</p>
			</div>
		</div>
	</div>
</body>

</html>
