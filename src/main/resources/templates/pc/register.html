<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パソコン情報登録</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6577;
    --paper:#f3f4f7;
    --card:#ffffff;
    --line:#e2e5eb;
    --navy:#233858;
    --navy-deep:#182740;
    --accent:#3d6b8a;
    --ok:#2f8f5b;
    --danger:#b3452f;
    --danger-bg:#fbeae6;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--navy-deep);color:#fff;padding:.85rem 1.5rem;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(24,39,64,.15);
  }
  .brand{display:flex;align-items:center;gap:.65rem;font-weight:700;letter-spacing:.02em;font-size:1.05rem;}
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(135deg,#3d6b8a,#233858);
    display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;
  }
  .topnav a{
    color:rgba(255,255,255,.72);text-decoration:none;font-size:.86rem;
    padding:.5rem .9rem;border-radius:6px;margin-left:.15rem;
    transition:background .15s, color .15s;
  }
  .topnav a:hover{background:rgba(255,255,255,.1);color:#fff;}
  .topnav a.active{background:rgba(255,255,255,.14);color:#fff;font-weight:500;}
  .topnav a.logout{color:#f2b5a8;}
  .topnav a.logout:hover{background:rgba(240,120,90,.15);}

  .page-wrap{max-width:760px;margin:0 auto;padding:2rem 1.5rem 4rem;}

  .page-head{margin-bottom:1.4rem;}
  .page-head h1{font-size:1.5rem;font-weight:700;margin:0 0 .2rem;color:var(--ink);}
  .page-head .sub{color:var(--ink-soft);font-size:.85rem;}

  .form-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1.8rem 1.9rem;box-shadow:0 1px 3px rgba(20,30,50,.04);
  }

  .field-group{margin-bottom:1.4rem;}
  .field-group label.field-label{
    display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:.4rem;
  }
  .field-hint{font-size:.75rem;color:var(--ink-soft);margin-top:.35rem;}
  .field-group .form-control, .field-group .form-select{
    border:1px solid var(--line);border-radius:8px;padding:.55rem .75rem;font-size:.9rem;
  }
  .field-group .form-control:focus, .field-group .form-select:focus{
    border-color:var(--accent);box-shadow:0 0 0 .2rem rgba(61,107,138,.12);
  }
  .is-invalid{border-color:var(--danger) !important;}
  .invalid-feedback-custom{
    color:var(--danger);font-size:.76rem;margin-top:.35rem;display:flex;align-items:center;gap:.3rem;
  }

  .section-divider{
    border:none;border-top:1px solid var(--line);margin:1.7rem 0;
  }
  .section-label{
    font-size:.78rem;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:1rem;
  }

  .sw-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:.65rem .9rem;border:1px solid var(--line);border-radius:9px;
    margin-bottom:.6rem;background:#fafbfc;
  }
  .sw-row .sw-name{font-size:.88rem;font-weight:500;color:var(--ink);}
  .form-switch .form-check-input{width:2.6em;height:1.4em;cursor:pointer;}
  .form-switch .form-check-input:checked{background-color:var(--ok);border-color:var(--ok);}

  .form-actions{
    display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.8rem;
  }
  .btn-cancel{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:8px;padding:.6rem 1.4rem;font-size:.88rem;text-decoration:none;
    display:inline-flex;align-items:center;
  }
  .btn-cancel:hover{background:#f4f5f7;color:var(--ink);}
  .btn-submit{
    background:var(--navy);border:none;color:#fff;border-radius:8px;
    padding:.6rem 1.6rem;font-size:.88rem;font-weight:500;
    display:inline-flex;align-items:center;gap:.4rem;
  }
  .btn-submit:hover{background:var(--navy-deep);color:#fff;}

  .global-error{
    background:var(--danger-bg);color:var(--danger);border:1px solid #f3cabf;
    border-radius:9px;padding:.8rem 1rem;font-size:.85rem;margin-bottom:1.4rem;
    display:flex;align-items:center;gap:.5rem;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">PC</div>パソコン管理</div>
  <nav class="topnav d-flex align-items-center">
    <a th:href="@{/pc}"><i class="bi bi-hdd-stack me-1"></i>パソコン情報一覧</a>
    <a th:href="@{/pc/new}" class="active"><i class="bi bi-plus-square me-1"></i>パソコン情報登録</a>
    <a th:href="@{/logout}" class="logout"><i class="bi bi-box-arrow-right me-1"></i>ログアウト</a>
  </nav>
</div>

<div class="page-wrap">

  <div class="page-head">
    <h1>パソコン情報登録</h1>
    <div class="sub">新しく管理対象に追加するパソコンの情報を入力してください</div>
  </div>

  <div class="form-card">

    <form th:action="@{/pc/new}" th:object="${pcRequest}" method="post" id="pcForm">

      <!-- パソコンNO. -->
      <div class="field-group">
        <label class="field-label">パソコンNO.</label>
        <input type="text" class="form-control" th:field="*{pcNumber}"
               th:classappend="${#fields.hasErrors('pcNumber')} ? 'is-invalid'"
               >
        <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('pcNumber')}" th:errors="*{pcNumber}"></div>
        <div class="field-hint">空欄可（null許容）。登録後も変更できます</div>
      </div>

      <!-- 利用者名 -->
      <div class="field-group">
        <label class="field-label">利用者名</label>
        <input type="text" class="form-control" th:field="*{userName}"
               th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'"
               placeholder="例）山田 太郎">
        <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>
      </div>

      <!-- 利用者属性 -->
      <div class="field-group">
        <label class="field-label">利用者</label>
        <select class="form-select" th:field="*{userAttr}"
                th:classappend="${#fields.hasErrors('userAttr')} ? 'is-invalid'">
          <option value="">選択してください</option>
          <option th:each="attr : ${userAttrOptions}" th:value="${attr}" th:text="${attr}"></option>
        </select>
        <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('userAttr')}" th:errors="*{userAttr}"></div>
        <div class="field-hint">利用者 / スタッフ / 体験者 から選択</div>
      </div>

      <hr class="section-divider">
      <div class="section-label">インストール済みソフト</div>

      <!-- Office / Illustrator・Photoshop トグル（softwareNames への追加/削除としてJSで管理） -->
      <div class="sw-row">
        <span class="sw-name">Office</span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" name="softwareNames" value="Office"
                 th:checked="${#lists.contains(pcRequest.softwareNames, 'Office')}">
        </div>
      </div>
      <div class="sw-row">
        <span class="sw-name">Illustrator/Photoshop</span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" name="softwareNames" value="Illustrator/Photoshop"
                 th:checked="${#lists.contains(pcRequest.softwareNames, 'Illustrator/Photoshop')}">
        </div>
      </div>

      <hr class="section-divider">
      <div class="section-label">機器情報</div>

      <div class="field-group">
        <label class="field-label">メーカー</label>
        <input type="text" class="form-control" th:field="*{maker}"
               th:classappend="${#fields.hasErrors('maker')} ? 'is-invalid'"
               placeholder="例）DELL">
        <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('maker')}" th:errors="*{maker}"></div>
      </div>

	  <div class="field-group">
	    <label class="field-label">OS</label>
	    <select class="form-select" th:field="*{os}"
	            th:classappend="${#fields.hasErrors('os')} ? 'is-invalid'">
	      <option value="Windows11">Windows11</option>
	      <option value="Windows10">Windows10</option>
	    </select>
	    <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('os')}" th:errors="*{os}"></div>
	  </div>

      <div class="field-group mb-0">
        <label class="field-label">備考</label>
        <textarea class="form-control" rows="3" th:field="*{remarks}"
                  th:classappend="${#fields.hasErrors('remarks')} ? 'is-invalid'"
                  placeholder="特記事項があれば入力してください"></textarea>
        <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}"></div>
      </div>

      <div class="form-actions">
        <a th:href="@{/pc}" class="btn-cancel">キャンセル</a>
        <button type="submit" class="btn-submit"><i class="bi bi-check-lg"></i>登録</button>
      </div>

    </form>
  </div>
</div>


</body>
</html>
