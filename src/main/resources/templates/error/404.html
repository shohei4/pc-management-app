<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>データが見つかりません</title>
</head>
<body>
    <h1>404 データが見つかりません</h1>

    <!-- ハンドラから渡された message を表示 -->
    <p th:text="${message}">エラーメッセージ</p>

    <!-- errorCode を渡している場合のみ表示 -->
    <p th:if="${errorCode}" th:text="'エラーコード: ' + ${errorCode}"></p>

    <a th:href="@{/pcs}">トップへ戻る</a>
</body>
</html>
