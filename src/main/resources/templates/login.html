<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .auth-card .card-body {
            padding: 2.5rem;
        }
        .btn-primary {
            background-color: #2b6cb0;
            border-color: #2b6cb0;
        }
        .btn-primary:hover {
            background-color: #245a93;
            border-color: #245a93;
        }
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card card">
            <div class="card-body">
                <h1 class="h4 fw-bold text-center mb-1">ログイン</h1>
                <p class="text-muted text-center small mb-4">アカウント情報を入力してください</p>

                <!-- エラー・ログアウトメッセージ -->
                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    ユーザー名またはパスワードが正しくありません
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                    ログアウトしました
                </div>
				<div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
				    登録が完了しました。ログインしてください
				</div>
				
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">ユーザー名</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="ユーザー名を入力" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">パスワード</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="パスワードを入力" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">ログイン</button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    アカウントをお持ちでない方は
                    <a th:href="@{/user/register}" class="text-decoration-none">新規登録</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
